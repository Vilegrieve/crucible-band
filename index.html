<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucible of Scorn | Official Band Page & EPK</title>
    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Red+Hat+Display:wght@400;700;900&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #08080a;
            --bg-card: #121013;
            --blood-red: #ef2d3e;
            --dark-red: #8b0000;
            --border-red: rgba(239, 45, 62, 0.3);
            --text-light: #f5f5f7;
            --text-muted: #a0a0aa;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Red Hat Display', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-body);
            line-height: 1.6;
        }

        /* Navigation */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 100;
            background: #050507;
            border-bottom: 2px solid var(--border-red);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: var(--font-head);
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--blood-red);
            text-shadow: 0 0 10px rgba(239, 45, 62, 0.4);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.75rem;
        }

        nav a {
            font-family: var(--font-head);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--blood-red);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.85rem 1.75rem;
            font-family: var(--font-head);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--blood-red);
            color: #fff;
            border: 1px solid var(--blood-red);
            box-shadow: 0 4px 15px rgba(239, 45, 62, 0.35);
        }

        .btn-primary:hover {
            background-color: #d81f2f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 45, 62, 0.5);
        }

        .btn-secondary {
            background: rgba(18, 16, 19, 0.8);
            color: var(--text-light);
            border: 1px solid var(--border-red);
        }

        .btn-secondary:hover {
            background: rgba(239, 45, 62, 0.15);
            border-color: var(--blood-red);
            transform: translateY(-2px);
        }

        /* Hero */
        .hero {
            padding: 6rem 2rem 5rem;
            text-align: center;
            background: radial-gradient(circle at center, #23080b 0%, #08080a 80%);
            border-bottom: 1px solid var(--border-red);
        }

        .hero-logo-box {
            max-width: 440px;
            margin: 0 auto 2rem;
        }

        .hero-logo-box img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(239, 45, 62, 0.45));
        }

        .hero h1 {
            font-family: 'Special Elite', cursive, sans-serif;
            font-size: clamp(2.4rem, 5.5vw, 4.2rem);
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 1.5rem 0 0.5rem;
            text-shadow: 0 0 15px rgba(239, 45, 62, 0.5), 2px 2px 4px #000;
        }

        .hero-sub {
            font-family: var(--font-head);
            font-size: 1rem;
            letter-spacing: 3px;
            color: var(--blood-red);
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .hero-btns {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Sections */
        section {
            padding: 5rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .sec-title {
            font-family: var(--font-head);
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            padding-bottom: 0.8rem;
        }

        .sec-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--blood-red);
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-red);
            padding: 2.5rem;
            border-radius: 4px;
        }

        .bio-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .bio-text p {
            margin-bottom: 1.2rem;
        }

        .bio-text p:last-child {
            margin-bottom: 0;
        }

        .highlight {
            color: var(--blood-red);
            font-weight: bold;
        }

        /* Band Members Vertical Stack & Emergence Fade */
        .member-stack {
            display: flex;
            flex-direction: column;
            gap: 4.5rem; /* Even spacing between cards */
            max-width: 820px;
            margin: 4rem auto 0;
        }

        /* The member card wrapper */
        .member-card {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            align-items: center;
            background-color: var(--bg-card);
            border: 1.5px solid var(--border-red);
            padding: 2.5rem;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            
            /* Card starts faded slightly down */
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 1s ease-out, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 650px) {
            .member-card {
                grid-template-columns: 240px 1fr;
            }
        }

        /* Scrolled into view state */
        .member-card.visible {
            opacity: 1;
            transform: translateY(0);
