<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucible of Scorn | Official Band Page & EPK</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@500;800;900&family=Red+Hat+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070709;
            --bg-card: rgba(18, 10, 11, 0.9);
            --card-border: rgba(239, 45, 62, 0.2);
            --blood-red: #ef2d3e;
            --dark-red: #8b0000;
            --glow-red: rgba(239, 45, 62, 0.4);
            --text-light: #f5f5f7;
            --text-muted: #a0a0aa;
            --font-display: 'Cinzel Decorative', serif;
            --font-sub: 'Orbitron', sans-serif;
            --font-body: 'Red Hat Display', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        #embers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(7, 7, 9, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(239, 45, 62, 0.2);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: var(--font-sub);
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-light);
        }

        .nav-logo span {
            color: var(--blood-red);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            font-family: var(--font-sub);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--blood-red);
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8rem 2rem 4rem;
            text-align: center;
            z-index: 2;
        }

        .hero-logo-container {
            position: relative;
            width: min(420px, 85vw);
            margin-bottom: 2rem;
        }

        .hero-logo-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(239, 45, 62, 0.4));
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(239, 45, 62, 0.3);
        }

        .hero-sub {
            font-family: var(--font-sub);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--blood-red);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.9rem 2rem;
            font-family: var(--font-sub);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--blood-red);
            color: var(--text-light);
            border: 1px solid var(--blood-red);
            box-shadow: 0 4px 15px rgba(239, 45, 62, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(239, 45, 62, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(7, 7, 9, 0.8);
            color: var(--text-light);
            border: 1px solid rgba(239, 45, 62, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(239, 45, 62, 0.15);
            border-color: var(--blood-red);
            transform: translateY(-2px);
        }

        /* Sections */
        section {
            padding: 6rem 2rem;
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
        }

        .sec-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 3.5rem;
            color: var(--text-light);
            position: relative;
            padding-bottom: 1rem;
        }

        .sec-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 3px;
            background: var(--blood-red);
            box-shadow: 0 0 10px var(--blood-red);
        }

        /* Bio */
        .bio-box {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            line-height: 1.8;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .bio-box p {
            margin-bottom: 1.25rem;
        }

        .bio-box p:last-child {
            margin-bottom: 0;
        }

        .highlight {
            color: var(--blood-red);
            font-weight: bold;
        }

        /* Music Showcase */
        .music-showcase {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
            align-items: center;
        }

        @media (min-width: 900px) {
            .music-showcase {
                grid-template-columns: 350px 1fr;
            }
        }

        .album-art-wrap {
            border: 1px solid var(--card-border);
            background: radial-gradient(circle, #2b0b0e 0%, #070709 100%);
            padding: 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

            width: 100%;
            max-width: 25
